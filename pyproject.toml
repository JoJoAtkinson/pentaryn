[project]
name = "dnd-notes"
version = "0.0.0"
description = "Foundry VTT operations tooling and SRD lookups for the Pentaryn campaign."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "ipykernel",
  "pandas",
  "pillow>=12.2.0",
  "pytest",
  "cairosvg",
  "python-dotenv",
  "tomlkit",
  "requests-cache>=1.3.1",
  # Read directly by scripts/foundry/update/risk.py (foundry/update-policy.yml). It was
  # already present transitively; a re-lock could drop it, so it is declared.
  "pyyaml>=6.0",
  # Arrow-key pickers for `make vtt-login` (world / user). Imported lazily and
  # degraded to a numbered prompt if absent, so a bare checkout still works.
  "questionary>=2.1.1",
  # Imported directly by scripts/dnd_roller.py. It was only ever present as a
  # chromadb transitive; removing the `vector` extra dropped it and broke the
  # roller's tests, so it is declared.
  "httpx>=0.27",
]

# Notes on native text layout (RAQM):
# - Only scripts/timeline_svg needs it; `build_timeline_svg` preflights and
#   errors with instructions if Pillow lacks RAQM.
# - Pillow only enables RAQM if it's built from SOURCE *after* the native libs
#   exist. A source build also needs the image codecs, not just the RAQM stack:
#     brew install libraqm harfbuzz fribidi freetype \
#                  jpeg-turbo libtiff little-cms2 openjpeg webp zlib
#   (Omitting the codecs fails the build with "could not be found for jpeg".)
# - Setup is scripted: `scripts/setup_pillow_raqm.sh`.
# - `no-binary-package` below applies to `uv sync`/`uv run`, so a sync cannot
#   silently swap the source build for a wheel and drop RAQM. [tool.uv.pip] is
#   kept too because it covers the separate `uv pip ...` code path.
[tool.uv]
no-binary-package = ["pillow"]

[tool.uv.pip]
no-binary = ["pillow"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Conservative, low-noise rule set: pycodestyle errors, pyflakes, import sorting.
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (uses real API tokens, costs money)",
]
testpaths = ["scripts/tests"]
python_files = ["test_*.py"]
# Put the repo root on sys.path so `from scripts.… import …` resolves without
# an editable install or a manually exported PYTHONPATH.
pythonpath = ["."]
