  - id: dnd5e-riders-self-cast-expiry
    packages: [dnd5e]
    modules: [pentaryn-riders]
    files: [foundry/module/pentaryn-riders/expiry.mjs, foundry/module/pentaryn-riders/table-core.mjs]
    markers: ["sourceStart", "isExpiryEvent", "getSourceActor", "selfEffectExpiry", "sourceActorFor", "system.origin.actor"]
    what: on preCreateActiveEffect (the creating client, GM or player; never GM-gated) an effect whose duration.expiry is core's turnStart, whose origin (dnd5e system.origin.actor when recorded, else any of system.origin.activity | item or the plain origin) is the actor it is created on or one of that actor's items / activities, while a combat has started and it is not that actor's turn, is rewritten to dnd5e's owner-aware sourceStart pseudo-expiry with duration.value null, as dnd5e's own _preCreate does for every pseudo-expiry; pure rule selfEffectExpiry (table-core, fixtures 45-52, 57). Then, for any sourceStart / sourceEnd effect with no system.origin.actor, the caster is resolved from system.origin.activity, then .item, then origin (fromUuidSync strict false; an Actor, or a document with one; a compendium index entry is skipped) and recorded in system.origin.actor (updateSource); pure rule sourceActorFor (fixtures 58-60). Shield on the caster's own turn, a caster-turn effect on a foe, no combat, any other expiry, an actor already recorded are untouched
    why: core's plain turnStart keys on start.combatant, so Shield cast on the attacker's turn expired at the attacker's next turn (TwPCoB, triage C3). And dnd5e 6.0.6's getSourceActor() reads system.origin.actor ?? item ?? activity ?? origin, where an effect its own activity applied carries actor null and item the spell's COMPENDIUM uuid, which resolves to an index entry with no actor, so the source is null, isExpiryEvent finds no combatant and falls back to start.round < context.round, the first turn of the NEXT ROUND (live 2026-11-07, Caven, last in initiative, cast Shield in round 2; the barrier went as round 3 began on Marrith's turn). dnd5e checks o.actor first, so the recorded uuid fixes getSourceActor on every client; belt and braces with pentaryn-importer's DDB correction (C2)
    native_when: dnd5e's spell data (or its ActiveEffect _preCreate) gives a self-cast reaction spell sourceStart itself and records the applying actor in system.origin.actor (or getSourceActor resolves the embedded activity before the compendium item), or core's turnStart keys on the effect's source combatant
    retire_class: guarded
    check: make foundry-riders-check

