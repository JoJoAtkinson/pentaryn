# The adjustments registry — every place our code leans on, patches, works around or extends
# a third-party package. Read by the Saturday updater's escalation step
# (scripts/foundry/update/escalate.py) and checked by `make foundry-adjustments-check`.
#
# Design: context/plans/smarter-updater.md. Use-doc: context/foundry/automated-updates.md.
#
# Row fields
#   id            stable kebab-case id; the analyst's "Still needed?" verdicts cite it
#   packages      upstream package ids this row depends on, or `core` / `dnd5e`
#   modules       which of OUR modules (or `scripts/foundry`) carries the adjustment
#   files         repo-relative files the adjustment lives in. The check fails when one is gone.
#   markers       literal strings that must still appear somewhere in `files`. The check fails
#                 when none of the files carries one, so a refactor cannot silently orphan a row.
#   what / why    one line each, for the analyst and for Joe
#   native_when   what in a release note would mean the package now does this itself
#   retire_class  safe = a flag/CSS/one-liner whose removal the module's tests cover
#                 guarded = needs a human to confirm at the table
#                 never = load-bearing; the package will not take it over
#   check         the command that proves the adjustment still works
#
# Every row was opened and confirmed against the source on 2026-10-10. Two seed rows from the
# plan were dropped on that read, and are recorded here so nobody re-adds them blind:
#   argon-toolbar-neighbour   pentaryn-ties' Attribute Review button only sets `order: 60`;
#                             Argon is named in a comment, no Argon API is used.
#   core-admin-api/cloud.py   cloud.py only probes :30000; it does not use the admin API.
#
# dnd5e 5.3.3 → 6.0.6 (2026-10-10, context/plans/dnd5e-6-upgrade.md): dnd5e-chat-card-flags
# became dnd5e-chat-message-types (6.x moved chat-card data from flags.dnd5e to message.type /
# message.system); five rows were added (legacy roll modes, token size lock, sense vision reset,
# the Item Piles rarity i18n shim, region-placement Escape). Retired with the port, not
# registered: pentaryn-senses' darkvision sync (dnd5e senseVisionSync). pentaryn-aoe's Escape
# handler was first retired too, then kept on review: core's Escape reaches a placeRegions
# placement only after closing every open window (row core-region-placement-escape).

# Extra search terms for the exposure grep (escalate.py), per package. The package id itself is
# always searched; these catch code that names the package by its global instead. Matched
# case-insensitively as plain substrings.
aliases:
  enhancedcombathud: ["ui.ARGON", "CONFIG.ARGON", "ArgonComponent"]
  enhancedcombathud-dnd5e: ["CONFIG.ARGON", "ArgonComponent"]
  item-piles: ["game.itempiles", "itempiles"]
  dice-so-nice: ["dice3d"]
  lib-wrapper: ["libWrapper"]

adjustments:
  - id: argon-panel-injection
    packages: [enhancedcombathud, enhancedcombathud-dnd5e]
    modules: [pentaryn-transform]
    files: [foundry/module/pentaryn-transform/hud-panels.mjs, foundry/module/pentaryn-transform/form-picker.mjs]
    markers: ["ArgonComponent", "CONFIG.ARGON"]
    what: Wild Shape / Starry Form buttons injected via render*ArgonComponent hooks; subclasses Argon's closure-private dnd5e button classes through CONFIG.ARGON.MAIN.BUTTONS; dnd5e 6.0.6 — no change needed (Argon reads abilities.*.checkBonus through a dnd5e shim removed in 6.2)
    why: Argon exposes no add-a-button API
    native_when: an "add button to panel" API, or a dnd5e transform / wild-shape panel of its own
    retire_class: never
    check: make foundry-transform-check

  - id: argon-target-picker-cancel
    packages: [enhancedcombathud]
    modules: [pentaryn-transform]
    files: [foundry/module/pentaryn-transform/argon.mjs]
    markers: ["cancelTargetPicker", "mouseup"]
    what: dispatches a synthetic right-button mouseup to cancel Argon's target picker before a form swap; Escape bound to the same; dnd5e 6.0.6 — no change needed (Argon reads abilities.*.checkBonus through a dnd5e shim removed in 6.2)
    why: the picker instance is private to Argon's bundle; right-click is its only cancel
    native_when: a public cancelTargeting() / cancel API on the picker
    retire_class: guarded
    check: make foundry-transform-check

  - id: argon-bonus-used-tracking
    packages: [enhancedcombathud]
    modules: [pentaryn-transform]
    files: [foundry/module/pentaryn-transform/wildshape-adapter.mjs, foundry/module/pentaryn-transform/hud-panels.mjs]
    markers: ["bonusUsedNow"]
    what: re-marks "bonus action used" after Argon rebuilds the HUD on a token swap, and gives a linked form's Action/Bonus/Reaction/Special panels Argon's in-combat pip count while its token holds the combat seat (Foundry's inCombat looks up the combatant's actorId, still the druid's); dnd5e 6.0.6 — no change needed (Argon reads abilities.*.checkBonus through a dnd5e shim removed in 6.2)
    why: Argon keeps used-state on the panel instance, which a token swap destroys
    native_when: bonus-used state kept on the actor/combatant rather than the panel instance
    retire_class: guarded
    check: make foundry-transform-check

  - id: argon-portrait-hp
    packages: [enhancedcombathud]
    modules: [pentaryn-transform]
    files: [foundry/module/pentaryn-transform/hud-panels.mjs, foundry/module/pentaryn-transform/core/hud.mjs]
    markers: ["renderPortraitPanelArgonComponent", "111/99"]
    what: repaints the portrait HP so temp HP reads "99+12 / 99" instead of "111/99"; dnd5e 6.0.6 — no change needed (Argon reads abilities.*.checkBonus through a dnd5e shim removed in 6.2)
    why: Argon prints value + temp over max
    native_when: the portrait shows temp HP separately
    retire_class: safe
    check: make foundry-transform-check

  - id: argon-tooltip-clear
    packages: [enhancedcombathud]
    modules: [pentaryn-transform]
    files: [foundry/module/pentaryn-transform/argon.mjs]
    markers: ["dropTooltip"]
    what: nulls ui.ARGON._tooltip so a stale tooltip does not survive a re-render; dnd5e 6.0.6 — no change needed (Argon reads abilities.*.checkBonus through a dnd5e shim removed in 6.2)
    why: Argon does not clear its tooltip on re-render
    native_when: Argon clears its own tooltip on re-render
    retire_class: safe
    check: make foundry-transform-check

  - id: dsn-skip-blind-study
    packages: [dice-so-nice]
    modules: [pentaryn-ties]
    files: [foundry/module/pentaryn-ties/study/apply.mjs]
    markers: ['"dice-so-nice": { skip: true }']
    what: sets flags["dice-so-nice"].skip on blind Study rolls so the GM's dice do not animate a secret check
    why: DSN animates blind rolls for the roller
    native_when: DSN hides blind rolls by itself, or renames/removes the skip flag
    retire_class: safe
    check: make foundry-ties-check

  - id: itempiles-corpses
    packages: [item-piles, itempilesdnd5e]
    modules: [pentaryn-dropbin]
    files: [foundry/module/pentaryn-dropbin/corpses.mjs, foundry/module/pentaryn-dropbin/dropbin.mjs, foundry/module/pentaryn-dropbin/loot.mjs, foundry/module/pentaryn-dropbin/piles.mjs]
    markers: ["itempiles"]
    what: turns a 0-HP NPC into a pile, the corpse eye, Loot all
    why: Item Piles has no corpse / loot-all flow
    native_when: Item Piles ships a native corpse or loot-all flow
    retire_class: never
    check: make foundry-dropbin-check

  - id: itempiles-attunement-repair
    packages: [item-piles]
    modules: [pentaryn-attunement]
    files: [foundry/module/pentaryn-attunement/actor-adapter.mjs]
    markers: ["isValidItemPile"]
    what: repairs attunement on items that arrive already attuned (an Item Piles Take, a sheet drop, an import); skips pile actors themselves
    why: dnd5e attunement is not re-checked when an item moves actors
    native_when: dnd5e or Item Piles clears attunement on transfer
    retire_class: guarded
    check: make foundry-attunement-check

  - id: dnd5e-armor-proficiencies
    packages: [dnd5e]
    modules: [pentaryn-attunement]
    files: [foundry/module/pentaryn-attunement/attunement-core.mjs, foundry/module/pentaryn-attunement/actor-adapter.mjs]
    markers: ["armorProficienciesMap"]
    what: patches CONFIG.DND5E.armorProficienciesMap, which covers only natural/clothing/light/medium/heavy/shield
    why: armour types outside the map read as non-proficient
    native_when: the map (or its replacement) covers every armour type
    retire_class: guarded
    check: make foundry-attunement-check

  - id: dnd5e-chat-message-types
    packages: [dnd5e]
    modules: [pentaryn-aoe, pentaryn-senses, pentaryn-riders, pentaryn-combat]
    files: [foundry/module/pentaryn-aoe/resolve.mjs, foundry/module/pentaryn-aoe/attacks.mjs, foundry/module/pentaryn-aoe/areas.mjs, foundry/module/pentaryn-aoe/effects.mjs, foundry/module/pentaryn-aoe/messages-adapter.mjs, foundry/module/pentaryn-senses/light-ui.mjs, foundry/module/pentaryn-riders/damage-riders.mjs, foundry/module/pentaryn-riders/card-note.mjs, foundry/module/pentaryn-riders/concentration.mjs, foundry/module/pentaryn-riders/shapes.mjs, foundry/module/pentaryn-combat/turn-riders.mjs, foundry/module/pentaryn-combat/turnflow/dialogs.mjs]
    markers: ["message.type", "system.targets", "system.origin", "getAssociatedActivity", "registry.messages"]
    what: reads message.type ("usage" / "attack" / "damage" / "save") and message.system.{activity,item,targets,origin,onSave,ability,mode,ammunition} on dnd5e 6 chat messages, plus message.getAssociatedActivity() and message.system.getEffects(); replaces the 5.x flags.dnd5e.roll / .activity / .item / .originatingMessage reads (renamed from dnd5e-chat-card-flags on the 6.0.6 port)
    why: the only way to find the usage / attack / damage message an area, save, effect or rider belongs to
    native_when: n/a — a data-shape dependency, not a workaround
    retire_class: never
    check: make foundry-aoe-check foundry-senses-check foundry-riders-check foundry-combat-check

  - id: dnd5e-importer-gate
    packages: [dnd5e]
    modules: [pentaryn-importer, scripts/foundry]
    files: [foundry/module/pentaryn-importer/importer-core.mjs, foundry/module/pentaryn-importer/documents-adapter.mjs, scripts/foundry/build_actors.py]
    markers: ["targetSystemVersion", "TARGET_SYSTEM_VERSION"]
    what: the importer refuses JSON built for another dnd5e minor (TARGET_SYSTEM_VERSION "6.0"); build_actors.py hard-codes the dnd5e 6.0 enums but still emits the legacy movement.walk / init.bonus / ac.calc "flat" shapes, which dnd5e migrates on create and update until 7.0
    why: CONTRACT.md §1 — actor JSON is built against one system's data model
    native_when: n/a
    retire_class: never
    check: pytest scripts/tests/

  - id: dnd5e-legacy-roll-modes
    packages: [dnd5e, core]
    modules: [pentaryn-aoe, pentaryn-ties]
    files: [foundry/module/pentaryn-aoe/resolve.mjs, foundry/module/pentaryn-aoe/settings.mjs, foundry/module/pentaryn-ties/study/apply.mjs]
    markers: ["_mapLegacyRollMode"]
    what: maps legacy roll-mode names ("gmroll", "blindroll", "publicroll") through core's foundry.dice.Roll._mapLegacyRollMode before handing them to dnd5e rolls (NPC area saves, blind Study rolls); pentaryn-aoe.npcSaveRollMode choices are gm / blind / public with a ready-time migration of a stored legacy value
    why: dnd5e 6 passes rollMode to core as messageMode, and core silently replaces an unknown name with the client default (public) — blind Study rolls and GM-side NPC saves would show to players
    native_when: dnd5e maps legacy roll-mode names itself before handing them to core, or core accepts them as messageMode
    retire_class: safe
    check: make foundry-aoe-check foundry-ties-check

  - id: dnd5e-token-size-lock
    packages: [dnd5e]
    modules: [pentaryn-aoe]
    files: [foundry/module/pentaryn-aoe/areas.mjs]
    markers: ["lockSize"]
    what: the area handle actor is traits.size "tiny", movement.hover true and prototypeToken.flags.dnd5e.lockSize true (ensureHandleActor/sweep keep it so); world data outside any module — the nine Marker prototypes and tokens, Hotspot containers (0.5, the 0.65 eye) and hand-resized NPCs — got flags.dnd5e.lockSize in the 5.3.3 pre-flight (audit list .state/core-rollback/token-sizes-pre-dnd5e6.json)
    why: dnd5e 6 tokenSizeSync is not read-only — Token5e._onOverrideSize has the active GM write the synced width/height to persisted creature tokens on first render, so 0.5 handles, 0.25 Markers and 0.5/0.65 Hotspots would be resized; hover also exempts the handle from movementAutomation falling
    native_when: dnd5e stops persisting synced sizes, or exempts non-creature / marker tokens from tokenSizeSync
    retire_class: guarded
    check: make foundry-aoe-check

  - id: dnd5e-sense-vision-reset
    packages: [dnd5e]
    modules: [pentaryn-senses]
    files: [foundry/module/pentaryn-senses/migrate.mjs]
    markers: ["sightReset"]
    what: one-shot per world (setting pentaryn-senses.sightReset < 1, active GM, on ready) resets every token and prototype with stored darkvision sight to basic / range 0, so dnd5e senseVisionSync derives vision from the sheet; replaces our retired darkvision sync
    why: senseVisionSync only adds to prepared data and never clears a stored sense — a removed sense (Goggles of Night confiscated) would keep the old darkvision range
    native_when: dnd5e senseVisionSync clears or overrides stored sight when the sense is gone; or every world has sightReset 1 (then the file can go)
    retire_class: safe
    check: make foundry-senses-check

  - id: itempiles-rarity-i18n
    packages: [item-piles, itempilesdnd5e, dnd5e]
    modules: [pentaryn-dropbin]
    files: [foundry/module/pentaryn-dropbin/i18n-shim.mjs, foundry/module/pentaryn-dropbin/dropbin.mjs]
    markers: ["ItemRarity"]
    what: at i18nInit adds DND5E.ItemRarityCommon / Uncommon / Rare / VeryRare / Legendary / Artifact (copied from DND5E.ITEM.Rarity.*) and DND5E.Unknown, only when missing
    why: dnd5e 6 renamed the keys; Item Piles' dnd5e config still reads the old ones for the merchant Rarity column and the unidentified-item placeholder, which otherwise show raw keys (cosmetic)
    native_when: an itempilesdnd5e / Item Piles release reads DND5E.ITEM.Rarity.* (or declares dnd5e 6 support)
    retire_class: safe
    check: make foundry-dropbin-check

  - id: core-region-placement-escape
    packages: [core, dnd5e]
    modules: [pentaryn-aoe, pentaryn-cursors]
    files: [foundry/module/pentaryn-aoe/escape.mjs, foundry/module/pentaryn-aoe/core.mjs, foundry/module/pentaryn-cursors/board.mjs]
    markers: ["_placementContext", "_cancelPlacement"]
    what: a PRIORITY Escape keybinding that cancels a RegionLayer#placeRegions placement in progress (dnd5e 6 TemplatePlacement) by calling core's internal RegionLayer#_cancelPlacement; returns false otherwise
    why: core's DEFERRED "dismiss" closes every open window (step 4) before it reaches the layer's _onDismissKey (step 5), and dnd5e BasePlacement minimises the sheet the spell was cast from, so the first Escape closes the sheet while the preview keeps following the mouse
    native_when: core's dismiss cancels an active region placement before it closes windows, or dnd5e's placement binds Escape itself
    retire_class: guarded
    check: make foundry-aoe-check

  - id: core-admin-api
    packages: [core]
    modules: [scripts/foundry]
    files: [scripts/foundry/update/admin.py, scripts/foundry/ops/login.py, automation/smoke/smoke.mjs]
    markers: ["Origin", "worldShutdown", "/join"]
    what: the documented assumptions about /setup, /auth, /join, /update and the socket — the same-origin Origin header (14.369), the 400/401 codes, worldShutdown
    why: the updater, login and smoke drive Foundry's undocumented admin surface
    native_when: n/a
    retire_class: never
    check: pytest scripts/tests/test_admin_api_369.py

  - id: core-portals-relative-uuid
    packages: [core]
    modules: [pentaryn-portals]
    files: [foundry/module/pentaryn-portals/portals-core.mjs, foundry/module/pentaryn-portals/scene-adapter.mjs, foundry/module/pentaryn-portals/cards.mjs]
    markers: ["relative: behavior"]
    what: resolves the relative region UUIDs that 14.368+ stores for same-scene destinations (DocumentUUIDField relativize)
    why: comparing raw stored UUIDs misses a same-scene link
    native_when: n/a
    retire_class: never
    check: make foundry-portals-check

  - id: core-ties-flag-wipe
    packages: [core]
    modules: [pentaryn-ties]
    files: [foundry/module/pentaryn-ties/core/known.mjs, foundry/module/pentaryn-ties/look-app.mjs, foundry/module/pentaryn-ties/preview-app.mjs]
    markers: ["ForcedDeletion"]
    what: recognises a whole-scope flag deletion with or without the `-=` marker (14.369 migrates `-=` keys to a ForcedDeletion operator)
    why: a wiped scope otherwise reads as an ordinary update and the ledger goes stale
    native_when: n/a
    retire_class: never
    check: make foundry-ties-check

  - id: itempiles-ties-pile-check
    packages: [item-piles]
    modules: [pentaryn-ties]
    files: [foundry/module/pentaryn-ties/look-menu.mjs, foundry/module/pentaryn-ties/preview-app.mjs]
    markers: ['"item-piles", "data"', "isValidItemPile"]
    what: the double-click look menu skips a token whose item-piles flag marks it a pile; the inspect window leaves pile actors out of the table's PCs
    why: an Item Piles container is a token and an actor; without the check a loot pile gets a closer-look menu and can show up as a PC to share with
    native_when: n/a
    retire_class: never
    check: make foundry-ties-check

  - id: transform-preupdate-unwrap
    packages: [core]
    modules: [pentaryn-transform]
    files: [foundry/module/pentaryn-transform/patches.mjs]
    markers: ["_preUpdateOperation", "pentarynUnwrapped"]
    what: wraps TokenDocument._preUpdateOperation to unwrap ForcedReplacement operators for a revert inside a region
    why: core hands raw operators to region behaviours
    native_when: core unwraps operators before region behaviours see them
    retire_class: guarded
    check: make foundry-transform-check

  - id: creatures-libwrapper
    packages: [lib-wrapper, core]
    modules: [pentaryn-creatures]
    files: [foundry/module/pentaryn-creatures/owner-sees.mjs]
    markers: ["isVisible", "_testCulled", "_previewType", "__pentarynCreaturesVisible"]
    what: Token#isVisible getter wrapped through wrapMethod (libWrapper WRAPPER when lib-wrapper is active, else the getter is replaced on the prototype, marker __pentarynCreaturesVisible) so an owner always sees their own summons and familiars (setting ownerSees); reads private _testCulled, _preview._previewType, isFilteredOut
    why: core hides a token nothing the player controls can see, even one they own (an Invisible Arcane Eye in darkness); core has no hook to add an owner override to visibility
    native_when: core lets owners always see owned tokens
    retire_class: guarded
    check: make foundry-creatures-check

  - id: itempiles-creatures-pile-flag
    packages: [item-piles]
    modules: [pentaryn-creatures]
    files: [foundry/module/pentaryn-creatures/creatures-core.mjs]
    markers: ["item-piles"]
    what: reads flags.item-piles.data.enabled on the token or its actor to leave piles out of the summon light and the Your creatures strip
    why: an Item Piles container is a token with an owner; without the check a loot pile gets a light and a portrait
    native_when: n/a
    retire_class: never
    check: make foundry-creatures-check

  # pentaryn-combat (2026-10-10, context/plans/melee-streamlining.md) — built, not yet synced.
  - id: argon-combat-panel-injection
    packages: [enhancedcombathud, enhancedcombathud-dnd5e]
    modules: [pentaryn-combat]
    files: [foundry/module/pentaryn-combat/hud/bars.mjs, foundry/module/pentaryn-combat/hud/buttons-ui.mjs]
    markers: ["renderActionPanelArgonComponent", "CONFIG.ARGON"]
    what: Full Attack on the Action bar, follow-ups on the Bonus bar, Nick / rider toggles / New turn on the Special bar, injected via render*ArgonComponent and ItemButton subclasses; Pole Strike hidden by class until earned
    why: Argon exposes no add-a-button API
    native_when: an "add button to panel" API, or a multi-attack / extra-attack button in enhancedcombathud-dnd5e
    retire_class: never
    check: make foundry-combat-check

  - id: argon-combat-swing-pips
    packages: [enhancedcombathud-dnd5e]
    modules: [pentaryn-combat]
    files: [foundry/module/pentaryn-combat/hud/bars.mjs]
    markers: ["overridePips", "maxActions"]
    what: the Action panel's maxActions / currentActions getters overridden per instance so the pips count Extra Attack swings (2 → 1 → 0) from our turn flag
    why: Argon's dnd5e Action panel is hard-coded to one pip
    native_when: Argon counts attacks per Attack action (Extra Attack) itself
    retire_class: guarded
    check: make foundry-combat-check

  - id: argon-combat-target-picker-reuse
    packages: [enhancedcombathud]
    modules: [pentaryn-combat]
    files: [foundry/module/pentaryn-combat/hud/picker.mjs, foundry/module/pentaryn-combat/hud/buttons-ui.mjs]
    markers: ["PickerProbe", "_onPreLeftClick"]
    what: Retarget mid-Full-Attack opens Argon's private TargetPicker by calling _onPreLeftClick on an unrendered ItemButton subclass; falls back to waiting for the next targetToken
    why: the TargetPicker class is private to Argon's bundle
    native_when: a public pickTargets() API
    retire_class: guarded
    check: make foundry-combat-check

  - id: argon-combat-weapon-set-seed
    packages: [enhancedcombathud]
    modules: [pentaryn-combat]
    files: [foundry/module/pentaryn-combat/offhand.mjs]
    markers: ["weaponSets"]
    what: writes flags.enhancedcombathud.weaponSets once for characters whose flag was never written (set 1 melee + Light off-hand, set 2 ranged)
    why: Argon dnd5e's default sets came up empty for the PCs on dnd5e 6
    native_when: Argon's getDefaultSets fills the PC slots on dnd5e 6
    retire_class: safe
    check: make foundry-combat-check

  - id: dnd5e-combat-offhand-mode-reset
    packages: [dnd5e]
    modules: [pentaryn-combat]
    files: [foundry/module/pentaryn-combat/shapes.mjs]
    markers: ["last.${activity.id}.attackMode"]
    what: after an off-hand attack, flags.dnd5e.last.<activity>.attackMode is set back to the weapon's main-hand mode
    why: dnd5e remembers the last attack mode per activity, so Offhand stuck to the next main-hand swing
    native_when: dnd5e stops remembering Offhand (or remembers it per hand)
    retire_class: safe
    check: make foundry-combat-check

  - id: dnd5e-combat-roll-hooks
    packages: [dnd5e]
    modules: [pentaryn-combat]
    files: [foundry/module/pentaryn-combat/counting.mjs, foundry/module/pentaryn-combat/turn-riders.mjs, foundry/module/pentaryn-combat/sequence.mjs]
    markers: ["dnd5e.preRollDamageV2", "subsequentActions: false"]
    what: Full Attack posts one usage card (use with subsequentActions:false) then one rollAttack per swing threaded via system.origin; preRollAttackV2 stamps the turn key; preRollDamageV2 adds TWF/GWM parts, auto rider dice and narrows a rider's damage type
    why: dnd5e has no multi-swing attack or once-per-turn rider offer
    native_when: dnd5e ships Extra Attack sequencing or rule effects that cover TWF/GWM/Sneak Attack (then turn weaponBonuses / riderOffers off)
    retire_class: guarded
    check: make foundry-combat-check

  - id: argon-combat-rerender-cleanup
    packages: [enhancedcombathud, enhancedcombathud-dnd5e]
    modules: [pentaryn-combat]
    files: [foundry/module/pentaryn-combat/hud/bars.mjs]
    markers: ["forgetButtons", "argon-onSetChangeUpdateItem", "_itemButtons"]
    what: before re-rendering a bar, removes the old buttons' drawer panels from the button-panel container, unhooks old weapon-set slots and drops them from ui.ARGON._itemButtons; bars re-render only when their follow-up signature changed
    why: an ActionPanel render leaves its previous drawers and weapon-set hooks behind (pentaryn-transform cleans its own the same way)
    native_when: Argon disposes a panel's previous buttons on render
    retire_class: guarded
    check: make foundry-combat-check

  - id: argon-combat-special-actions
    packages: [enhancedcombathud-dnd5e, core]
    modules: [pentaryn-combat]
    files: [foundry/module/pentaryn-combat/turnflow/action-buttons.mjs, foundry/module/pentaryn-combat/turnflow/boundaries.mjs]
    markers: ["wrapSpecial", "createChatMessage", "combatTurnChange"]
