    markers: ["endConcentration", "summonFell", "droppedToZero", "concentrationSpellName"]
    what: on updateActor with system.attributes.hp.value at 0 or less — and the old value above 0 when dnd5e's options.dnd5e.hp carries it (droppedToZero — a second hit at 0 is not a fall) — the active GM (with no GM online, the user who made the change) resolves each stamped summon token's concentration effect with fromUuid, claims the token (kit claimDocument, key summonFell, so two tabs on that account end it once), calls caster.endConcentration(effect) and whispers one line to the caster's owners and the GMs; the spell's name is read from the effect's flags.dnd5e.item (concentrationSpellName); the existing cleanup (row dnd5e-concentration-summons) then removes the token(s). A token already in flight is skipped; an effect that is gone ends nothing. HP → 0 only, never deleteToken, which portals and pins fire on scene moves
    why: the 2024 summon spells say the spirit disappears when it drops to 0 HP or the spell ends; dnd5e 6.0.6 does only the second direction, so a fallen Elemental Spirit lay there with the concentration still up (and dropbin made it a corpse) (TwPCoB, triage E1)
