# Policy for the unattended Saturday-06:00 updater.
# See automation/README.md for the whole design; this file is the only thing you should
# need to edit to change its behaviour.

# Foundry's own release channel. `check()` PERSISTS this into Config/options.json,
# so changing it here changes the running server's channel too.
channel: stable

core:
  # 14.365 -> 14.372, same generation. Foundry's previewCompatibility must come back
  # clean for every installed package before this is allowed to run.
  auto_build_updates: true
  # 14 -> 15. Foundry's own isGenerationalChange sets willDisableModules: a generation
  # bump disables every module that has not been re-verified. That is exactly the
  # "high-risk migration that will take a lot of tokens" case — always hold and notify.
  auto_generation_change: false

packages:
  # Major bumps never apply straight away; they go to the adjudicator, which reads the
  # release notes and decides. Flip this to true only if you want majors unattended.
  auto_major: false

  # Never update these, whatever upstream says. Pinning belongs here, not in a comment.
  # foundry-mcp-bridge is installed from Joe's fork (../foundry-vtt-mcp, branch pentaryn),
  # but its module.json still points at upstream's manifest. The 2026-09-26 run "patched"
  # it 0.8.3 -> 0.8.4 with upstream's build and silently removed the fork's eval handler,
  # which every eval-js / game.pentaryn.rules lookup depends on. Rebase the fork instead.
  hold: [foundry-mcp-bridge]

  # Always send these to the adjudicator even for a patch bump. Use for a module that
  # has burned you before. dnd5e is deliberately NOT here: you chose to treat the system
  # like any other module, backed by the rolling OneDrive snapshots (see cloud.py:
  # 10 rolling, 5-day coalescing, past generations preserved forever).
  # dnd5e 6.0.6 went in by hand on 2026-10-10, ahead of the Argon / Item Piles adapters
  # (context/plans/dnd5e-6-upgrade.md); the 6.x go/no-go gate no longer applies. The updater stays paused
  # (.state/vtt-update.pause) until Joe resumes it; dnd5e is not in `hold:`.
  review_always: []

retention:
  # Every run backs up the packages it is about to change (Foundry's per-package
  # createBackup) — that is what a module rollback restores from, and it costs seconds.
  # A FULL snapshot copies every installed package instead: 2.7 GB here, almost all of
  # it premium map art that has not changed in months. The phase-1 OneDrive tar already
  # covers worlds + Config + modules, so the full snapshot is off by default.
  full_snapshot: false
  native_snapshots: 4   # kept only when full_snapshot is on
  core_bundles: 2       # local tars of Resources/app, ~287 MB each
  system_mirrors: 3     # OneDrive system-backup/<system>-<version>.tar.gz

lifecycle:
  # Leave the table DOWN when a run finishes: world deactivated, Foundry quit, tunnel
  # closed. Nobody is playing at four in the morning, and leaving a public tunnel up all
  # week is exposure for nothing — you bring it up yourself with `make vtt-up`.
  #
  # Set false to instead put back exactly what the run found (server up if it was up,
  # world relaunched, tunnel restored).
  #
  # Note: the shutdown deliberately does NOT take a parting backup the way
  # `make vtt-down` does. The run already snapshotted before touching anything, and a
  # second snapshot minutes later would fall inside the 5-day coalescing window and
  # REPLACE it — destroying the week's only pre-update restore point.
  #
  # 2026-10-17: false. BOSS is an always-on server — the world stays up so players can
  # explore without Joe, and the run happens inside the Monday nightly, which expects the
  # world it relaunched to still be serving afterwards.
  shutdown_when_done: false

smoke:
  # "all" smokes every installed world. Migration is per-world and happens on launch,
  # so a world you skip migrates untested at your next manual launch. A list that names
  # no installed world smokes nothing: the run still finishes, but says so and notifies ⚠️.
  worlds: all
  browser: true
  browser_dwell_seconds: 60
  # Console noise that is not worth failing a run over. Matched as substrings.
  ignore_console:
    - "Failed to load resource: net::ERR_"
    - "DevTools failed to load source map"
    - "[Deprecation]"

window:
  # launchd coalesces a run missed while the Mac was asleep onto the next wake. Without
  # this guard a Saturday-afternoon wake would take the tunnel down an hour before a
  # session. Outside these hours the run declines and notifies instead.
  # Must contain the scheduled 04:06 start with room in front of it, and must NOT
  # stretch into the afternoon — the whole point is to refuse a run that launchd
  # deferred onto a wake hours later, which would take the tunnel down before a session.
  # BOSS (2026-10-17): the run starts inside the Monday 03:00 nightly, right after its
  # backup (~03:06), so earliest is 03:00.
  earliest: "03:00"
  latest: "09:00"

report:
  commit: true
  push: true

# ── LLM steps ────────────────────────────────────────────────────────────────
# Every claude -p call the run makes goes through scripts/foundry/update/llm.py: no
# tools for anything that reads release notes, no MCP, a scratch cwd, an explicit
# --effort, a --max-budget-usd cap, and its cost recorded in the run report.
llm:
  # restricted = --restricted: user/project/local settings (and their hooks) ignored.
  # bare = --bare: stricter, but it reads auth ONLY from ANTHROPIC_API_KEY — on this Mac
  # (OAuth login) every --bare call fails "Not logged in". Use it only with a key.
  isolation: restricted
  # Every budget_usd below is a RUNAWAY GUARD, not a target. The CLI checks it after the
  # turn: a call that lands over its cap is billed and its answer discarded (probed
  # 2026-10-10). Keep caps well above the expected cost, never near it.
  # Grades the `review` bucket from release notes. Unchanged model; effort now explicit.
  # Typical $0.05-0.15; uncapped before 2026-10-10.
  adjudicator: {model: opus, effort: medium, timeout_s: 600, budget_usd: 1.50}
  # Writes the Saturday markdown from the JSON record. Sonnet: a summary of a record is
  # Sonnet work. Set model: opus to go back.
  report: {model: sonnet, effort: medium, timeout_s: 600, budget_usd: 0.50}

# ── Escalation (context/plans/smarter-updater.md) ───────────────────────────
# Between adjudication and apply, a cheap triage call decides whether this run needs an
# impact analysis. Python bounds it: the floor is what the facts demand (a core bump,
# an update to a package in foundry/adjustments.yml or that our code greps for, whose
# notes are not a clean patch), the ceiling is max_tier lowered by the clock and the
# budget. Escalation can only HOLD more and write plans; it never applies anything the
# rules above did not already allow. --skip-llm skips it entirely.
escalation:
  enabled: true
  # none | analyze | decide | fix. decide and fix are designed, not built (v2): anything
  # above `analyze` is clamped to it. Raise only as each tier earns trust.
  max_tier: analyze
  # Triage failed (timeout, bad JSON, injection flag): `hold_exposed` holds every package
  # that touches code we adjusted for the week; `proceed` carries on as before.
  on_triage_failure: hold_exposed
  reserve_minutes: 25     # kept back from window.latest for the smoke test + shutdown
  forced_minutes: 120     # a --force run outside the window gets this long instead
  # The whole step's wall clock. The wrapper's backstop is 90 min + this (130 min), so a
  # stuck 04:06 run is killed ~06:16 — and the wrapper then restores service, releases
  # the lock and notifies itself (cli killed), since the 06:12 watchdog may have passed.
  # Capped at 90, so the backstop fires before the 3 h stale-lock threshold.
  max_minutes: 40
  budget_usd_per_run: 12  # all escalation calls together, after the adjudicator
  # A failed analysis is retried on later Saturdays at most this many times for the same
  # version pair and source (then: held, "run it by hand"). Stops a held major whose
  # analysis always times out from being re-bought every week.
  analysis_attempts: 2
  # A HELD package's analysis is reused for this many days while the installed version
  # and the target's major stay the same, instead of re-buying it every time upstream
  # ships a patch or our source changes. 0 = exact (version pair, source) matches only.
  held_reuse_days: 28
  tiers:
    # ~$0.002 on Haiku; the cap leaves room for the Sonnet fallback (~$0.04).
    triage:  {model: haiku, fallback: sonnet, effort: low, timeout_s: 120, budget_usd: 0.25}
    # Opus reads the notes against our source; one call per package, cached per
    # (version pair, registry rows, source files) in .state/vtt-update-analysis/.
    # Expected $0.4-1.2 (a core bundle is ~250 KB of source); the cap is the guard.
    analyze: {model: opus, effort: high, timeout_s: 900, budget_usd: 2.50, budget_usd_per_run: 5.00}
    # v2, not built:
    decide:  {model: fable, effort: high, timeout_s: 600, budget_usd: 0.75}
    fix:     {model: opus, effort: high, timeout_s: 2400, budget_usd: 8.00}
    review:  {model: opus, effort: xhigh, timeout_s: 900, budget_usd: 1.00}
    explain: {model: sonnet, effort: low, timeout_s: 120, budget_usd: 0.10}
  unattended_fix:
    allowed_modules: []   # v2, e.g. [pentaryn-portals, pentaryn-ties]; empty = never
    allow_scripts: false  # v3
  unattended_retire: false  # v3

# The registry escalation reads. `make foundry-adjustments-check` keeps it honest.
adjustments: foundry/adjustments.yml
